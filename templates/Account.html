{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('../static/BackgroundGreen.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            backdrop-filter: blur(3px);
            margin: 10px;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #59986c;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }

        /* Header Title */
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Button Container */
        .button-container {
            display: flex;
            gap: 10px; /* Space between buttons */
        }

        /* Button Styles */
        .button {
            background-color: white;
            color: #59986c;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .button:hover {
            background-color: #a5e4b9; /* Darker blue */
            color: white;
        }
        
        input[type="text"], input[type="password"], input[type="email"], input[type="date"], input[type="datetime-local"], input[type="age"], textarea {
                width: 200px;
                padding: 10px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 8px;
                box-sizing: border-box;
                font-size: 16px;
            }
        
        .save-button {
            width: 100px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #59986c;
            color: white;
        }
        .panda-image {
            position: fixed;
            bottom: 0px;
            right: 0;
            padding: 10px 20px;
            width: 270px;
            height: 270px;
            z-index: -1;
        }

        .speech-bubble {
            position: absolute;
            bottom: 200px;
            right: 240px;
            background: #81c898;
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            width: fit-content;
            max-width: 600px;
            font-family: Arial, sans-serif;
            font-size: 22px;
        }
        .speech-bubble:after {
            content: "";
            position: absolute;
            right: 10px; /* Position arrow at the bottom-right corner */
            bottom: -15px; /* Place arrow below the bubble */
            width: 0;
            height: 0;
            border: 15px solid transparent; /* Size of the arrow */
            border-top-color: #81c898; /* Matches the bubble color */
            border-bottom: 0;
            border-left: 0;
        }
    
    </style>
</head>
<body>

    <header>
        <div class="logo">Account information</div>
        <div class="button-container">
            <form action="{% url 'home' %}">
                {% csrf_token %}
                <button class="button">Home</button>
            </form>
        </div>
    </header>
    <div>
    
        <form id="Form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="save-button">Save</button>
        </form>
        
    </div>

    <img src="{% static 'pandalogo.jpg' %}" class="panda-image" alt = "pandalogo">

    <div class="speech-bubble" id="speechBubble">
        On this page you will find information about your account. If you made any changes, don't forget to push the save-button!
    </div>

</body>
</html>
